services:
  bot:
    container_name: maid-san
    restart: unless-stopped
    build:
      context: .
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      GUILD_ID: ${GUILD_ID}
      HONEYPOT_ID: ${HONEYPOT_ID}
      LOG_CHANNEL_ID: ${LOG_CHANNEL_ID}
      ALLOWED_FOR_IDS: ${ALLOWED_FOR_IDS}
      EXCLUDED_CHANNELS: ${EXCLUDED_CHANNELS}
      MODERATORS_IDS: ${MODERATORS_IDS}
    volumes:
      - samples:/app/assets/samples:ro
      - regex_patterns:/app/assets/regex
volumes:
  samples:
  regex_patterns:
